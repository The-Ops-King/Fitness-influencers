<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Post Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C0B0A; --panel:#141210; --panel2:#1C1917; --line:#2A2724;
    --paper:#EDEAE4; --muted:#8A857D; --accent:#3F7D5C; --accent-dim:#2A5540;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  .app{display:grid;grid-template-columns:400px 1fr;height:100vh;height:100dvh}

  .rail{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:22px 22px 60px}
  .brandbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
  .brandbar b{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .brandbar span{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}

  .grp{margin-bottom:24px}
  .grp.hide{display:none}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
       margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lbl em{font-style:normal;color:#5E5A54;letter-spacing:.06em;text-transform:none;font-size:10px}

  textarea{width:100%;min-height:124px;resize:vertical;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;color:var(--paper);font-family:var(--sans);font-size:16px;font-weight:500;line-height:1.42;padding:12px}
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .chip{font-family:var(--sans);font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line);
    color:#B9B4AC;padding:4px 9px;border-radius:5px;cursor:pointer;line-height:1.3}
  .chip:hover{border-color:#3E3A35;color:var(--paper)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#06120C}
  .chips-empty{font-size:12px;color:#5E5A54;font-family:var(--mono)}

  .slides{display:flex;gap:7px;flex-wrap:wrap}
  .sbtn{width:38px;height:47px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);
    color:#6E6960;font-family:var(--mono);font-size:11px;cursor:pointer;display:grid;place-items:center}
  .sbtn.on{border-color:var(--accent);color:var(--accent);background:#12261C}
  .sbtn.cta{border-style:dashed}
  .sbtn.add{color:var(--muted);font-size:16px}

  label.tog{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:#B9B4AC;margin-bottom:7px}
  label.tog input{accent-color:var(--accent);width:15px;height:15px;flex:0 0 auto;margin:0}
  label.tog.on{color:var(--paper);border-color:#3E3A35}

  input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    color:var(--paper);font-family:var(--sans);font-size:14px;font-weight:500;padding:9px 10px;margin-bottom:7px}

  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:9px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);
    color:#6E6960;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .seg button:hover{border-color:#3E3A35;color:var(--paper)}
  .seg button.on{border-color:var(--accent);color:var(--accent);background:#12261C}

  button.act{width:100%;padding:12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);
    color:#06120C;font-family:var(--sans);font-weight:800;font-size:14px;cursor:pointer;letter-spacing:-.01em;margin-bottom:7px}
  button.act.ghost{background:transparent;color:var(--accent)}
  button.act:hover{filter:brightness(1.08)}
  button.tiny{padding:8px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  button.tiny:hover{color:var(--paper);border-color:#3E3A35}

  .stage{display:grid;place-items:center;padding:32px;overflow:auto;
    background:radial-gradient(1100px 700px at 50% 0%, #17140F 0%, #0C0B0A 62%)}
  .frame{display:flex;flex-direction:column;align-items:center;gap:13px}
  canvas#c{width:min(430px, 78vh * 0.8);height:auto;display:block;border-radius:3px;
    box-shadow:0 34px 70px -22px rgba(0,0,0,.9), 0 0 0 1px #221F1C}
  .meta{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#4E4A44;text-align:center}
  .nav{display:flex;gap:6px}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;height:auto}
    .rail{border-right:none;border-bottom:1px solid var(--line);order:2}
    .stage{order:1;padding:16px;border-bottom:1px solid var(--line)}
    canvas#c{width:min(290px,60vw)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="rail">
    <div class="brandbar"><b>Post Builder</b><span>1080 × 1350</span></div>

    <div class="grp">
      <div class="lbl">Slides</div>
      <div class="slides" id="slides"></div>
    </div>

    <div class="grp" id="g_text">
      <div class="lbl">Text <em id="thint">enter = new line</em></div>
      <textarea id="ta" spellcheck="true"></textarea>
      <div class="lbl" style="margin-top:14px">Accent words <em>tap to toggle</em></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="grp hide" id="g_cta">
      <div class="lbl">Destination <em>footer line</em></div>
      <input type="text" id="ctaWhere" value="Link in bio">
      <div class="lbl" style="margin-top:13px">Arrow <em>where to look</em></div>
      <div class="seg" id="arrowseg"></div>
    </div>

    <div class="grp">
      <div class="lbl">Options</div>
      <label class="tog" id="l_swipe"><input type="checkbox" id="swipe" checked> Swipe cue on all but last</label>
      <label class="tog" id="l_cta"><input type="checkbox" id="cta" checked> End with CTA slide</label>
    </div>

    <div class="grp">
      <div class="lbl">Identity</div>
      <input type="text" id="handle" value="@jtylerray">
      <input type="text" id="name" value="J. Tyler Ray">
    </div>

    <div class="grp">
      <div class="lbl">Export</div>
      <button class="act" id="dl1">Download this slide</button>
      <button class="act ghost" id="dlall">Download all slides</button>
    </div>
  </div>

  <div class="stage">
    <div class="frame">
      <canvas id="c" width="1080" height="1350"></canvas>
      <div class="nav">
        <button class="tiny" id="prev">← prev</button>
        <button class="tiny" id="next">next →</button>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   TOKENS
   ============================================================ */
const T = {
  ink:'#0C0B0A', paper:'#EDEAE4', muted:'#7C766D', dim:'#57524B',
  accent:'#3F7D5C', line:'#2A2724',
  sans:'"Inter Tight",-apple-system,Helvetica,Arial,sans-serif',
  mono:'"JetBrains Mono",ui-monospace,Menlo,monospace'
};
const W=1080, H=1350, PAD=92;

const state = {
  slides:[
    { text:"4,000 leads. 3,700 untouched.", accents:new Set([2,3]) },
    { text:"The fix is boring.\nOne workflow that touches every single one of them, on a schedule, without you.", accents:new Set([3]) }
  ],
  idx:0, showSwipe:true, showCta:true,
  handle:'@jtylerray', name:'J. Tyler Ray',
  ctaWhere:'Link in bio', arrowDir:'up',
  cta:{ text:"Book a call.\n\n30 minutes. I'll tell you what's broken in your sales ops and what it costs to fix.",
        accents:new Set() },
  fig:null
};

const $=id=>document.getElementById(id);
const canvas=$('c'), ctx=canvas.getContext('2d');
const words=s=>s.split(/(\n)/).flatMap(p=>p==='\n'?['\n']:p.split(/\s+/)).filter(w=>w!=='');
const totalSlides=()=>state.slides.length+(state.showCta?1:0);
const isCta=i=>state.showCta && i===state.slides.length;
/* the CTA is shaped exactly like a slide, so one editor drives both */
const current=()=>isCta(state.idx)?state.cta:state.slides[state.idx];

/* a blank line splits the CTA into the ask and its supporting line */
function splitCta(){
  const ws=words(state.cta.text);
  let cut=-1;
  for(let k=0;k<ws.length-1;k++) if(ws[k]==='\n'&&ws[k+1]==='\n'){cut=k;break;}
  if(cut<0) return {head:ws,sub:[],hA:state.cta.accents,sA:new Set()};
  const off=cut+2;
  return {
    head: ws.slice(0,cut), sub: ws.slice(off),
    hA: new Set([...state.cta.accents].filter(n=>n<cut)),
    sA: new Set([...state.cta.accents].filter(n=>n>=off).map(n=>n-off))
  };
}

/* ============================================================
   TEXT: wrap, per-word accent, auto-fit
   ============================================================ */
function measure(ws,accents,maxW,size,lh,weight,tr){
  ctx.font=`${weight} ${size}px ${T.sans}`; ctx.letterSpacing=tr;
  const sp=ctx.measureText(' ').width;
  const lines=[]; let cur=[],curW=0;
  const push=()=>{lines.push(cur);cur=[];curW=0;};
  ws.forEach((w,i)=>{
    if(w==='\n'){push();return;}
    const ww=ctx.measureText(w).width;
    if(cur.length && curW+sp+ww>maxW) push();
    cur.push({t:w,w:ww,a:accents&&accents.has(i)});
    curW += cur.length===1?ww:sp+ww;
  });
  if(cur.length) push();
  return {lines,height:lines.length*size*lh,space:sp};
}

function drawText(ws,accents,box,o){
  const lh=o.lh||1.13, weight=o.weight||900, tr=o.tracking||'-0.028em';
  let size=o.max, L=measure(ws,accents,box.w,size,lh,weight,tr);
  while(size>o.min && L.height>box.h){ size-=2; L=measure(ws,accents,box.w,size,lh,weight,tr); }
  ctx.font=`${weight} ${size}px ${T.sans}`; ctx.letterSpacing=tr;
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  const lineH=size*lh;
  let cy=box.y+(o.top?0:(box.h-L.height)/2)+size*0.86;
  L.lines.forEach(line=>{
    let cx=box.x;
    line.forEach((it,i)=>{
      if(i) cx+=L.space;
      ctx.fillStyle = it.a ? T.accent : (o.color||T.paper);
      ctx.fillText(it.t,cx,cy); cx+=it.w;
    });
    cy+=lineH;
  });
  ctx.letterSpacing='0px';
  return cy-lineH+size*0.16;
}

/* ============================================================
   PARTS
   ============================================================ */
function mono(t,x,y,size,color,track,align){
  ctx.font=`500 ${size}px ${T.mono}`; ctx.letterSpacing=(track??0.2)+'em';
  ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(t,x,y); ctx.textAlign='left'; ctx.letterSpacing='0px';
}
function hairline(y){ ctx.fillStyle=T.line; ctx.fillRect(PAD,y,W-PAD*2,1); }

function brackets(inset,arm){
  ctx.strokeStyle=T.line; ctx.lineWidth=2.5; ctx.lineCap='butt';
  [[inset,inset,1,1],[W-inset,inset,-1,1],[inset,H-inset,1,-1],[W-inset,H-inset,-1,-1]]
    .forEach(([x,y,sx,sy])=>{
      ctx.beginPath(); ctx.moveTo(x,y+sy*arm); ctx.lineTo(x,y); ctx.lineTo(x+sx*arm,y); ctx.stroke();
    });
}

function arrow(x,y,len,dir){
  ctx.strokeStyle=T.accent; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  if(dir==='up'){ ctx.moveTo(x,y); ctx.lineTo(x,y-len); ctx.moveTo(x-10,y-len+13); ctx.lineTo(x,y-len); ctx.lineTo(x+10,y-len+13); }
  else if(dir==='down'){ ctx.moveTo(x,y-len); ctx.lineTo(x,y); ctx.moveTo(x-10,y-13); ctx.lineTo(x,y); ctx.lineTo(x+10,y-13); }
  else { ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.moveTo(x+len-13,y-10); ctx.lineTo(x+len,y); ctx.lineTo(x+len-13,y+10); }
  ctx.stroke();
}

function swipeCue(y){
  const label='swipe';
  ctx.font=`700 26px ${T.mono}`; ctx.letterSpacing='0.22em';
  const w=ctx.measureText(label).width; ctx.letterSpacing='0px';
  const aw=46, R=W-PAD;
  mono(label,R-aw-16-w,y,26,T.accent,0.22); arrow(R-aw,y-8,aw,'right');
}

function figure(){
  if(!state.fig) return;
  const im=state.fig, fw=560, fh=fw*(im.height/im.width);
  ctx.drawImage(im, W-52-fw, H-52-fh, fw, fh);
}

/* ============================================================
   SLIDE
   ============================================================ */
function paint(){
  const i=state.idx, total=totalSlides();
  ctx.fillStyle=T.ink; ctx.fillRect(0,0,W,H);

  brackets(52,46);
  mono(String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0'),PAD,168,24,T.accent,0.2);
  mono(state.handle,W-PAD,168,24,T.muted,0.14,'right');

  if(isCta(i)){
    const c=splitCta();
    const e=drawText(c.head,c.hA,{x:PAD,y:290,w:W-PAD*2,h:c.sub.length?260:400},
      {max:134,min:62,top:true,lh:1.05});
    if(c.sub.length) drawText(c.sub,c.sA,{x:PAD,y:e+56,w:W-PAD*2-40,h:180},
      {max:36,min:24,weight:500,lh:1.34,top:true,color:T.muted,tracking:'0em'});
    figure();
    const hasArrow = state.arrowDir!=='none';
    if(hasArrow) arrow(PAD+13,H-114,34,state.arrowDir);
    ctx.font=`800 34px ${T.sans}`; ctx.fillStyle=T.accent; ctx.textBaseline='alphabetic';
    ctx.fillText(state.ctaWhere, hasArrow?PAD+44:PAD, H-116);
  } else {
    const s=state.slides[i];
    drawText(words(s.text),s.accents,{x:PAD,y:280,w:W-PAD*2,h:H-530},{max:108,min:44});
    hairline(H-196);
    ctx.fillStyle=T.accent; ctx.fillRect(PAD,H-134,14,14);
    ctx.font=`600 27px ${T.sans}`; ctx.fillStyle=T.muted; ctx.textBaseline='alphabetic';
    ctx.fillText(state.name,PAD+34,H-116);
    if(state.showSwipe && i<total-1) swipeCue(H-118);
  }
}

function render(){
  paint();
  $('meta').textContent = `slide ${state.idx+1} of ${totalSlides()} · 1080×1350`;
}

/* keep accents attached to their words while the text is edited */
function remap(oldText,oldSet,newText){
  const ow=words(oldText), nw=words(newText);
  const wanted=[...oldSet].sort((a,b)=>a-b).map(i=>ow[i]).filter(Boolean);
  const out=new Set(), used=new Set();
  wanted.forEach(word=>{ for(let j=0;j<nw.length;j++){ if(!used.has(j)&&nw[j]===word){used.add(j);out.add(j);break;} } });
  return out;
}

/* ============================================================
   RAIL
   ============================================================ */
function paintRail(){
  const i=state.idx, ctaIdx=state.slides.length, onCta=isCta(i);

  const sc=$('slides'); sc.innerHTML='';
  state.slides.forEach((_,n)=>{
    const b=document.createElement('button');
    b.className='sbtn'+(n===i?' on':''); b.textContent=String(n+1).padStart(2,'0');
    b.onclick=()=>{state.idx=n;sync();}; sc.appendChild(b);
  });
  if(state.showCta){
    const b=document.createElement('button');
    b.className='sbtn cta'+(i===ctaIdx?' on':''); b.textContent='CTA';
    b.onclick=()=>{state.idx=ctaIdx;sync();}; sc.appendChild(b);
  }
  const add=document.createElement('button');
  add.className='sbtn add'; add.textContent='+'; add.title='Add slide';
  add.onclick=()=>{state.slides.push({text:'',accents:new Set()});state.idx=state.slides.length-1;sync();$('ta').focus();};
  sc.appendChild(add);
  if(state.slides.length>1){
    const del=document.createElement('button');
    del.className='sbtn add'; del.textContent='−'; del.title='Delete this slide';
    del.onclick=()=>{ if(isCta(state.idx))return; state.slides.splice(state.idx,1); state.idx=Math.max(0,state.idx-1); sync(); };
    sc.appendChild(del);
  }

  $('g_cta').classList.toggle('hide',!onCta);
  $('thint').textContent = onCta ? 'blank line = supporting text' : 'enter = new line';

  const ta=$('ta'), chips=$('chips'), s=current();
  if(document.activeElement!==ta) ta.value=s.text;
  const ws=words(s.text); chips.innerHTML='';
  if(!ws.length) chips.innerHTML='<div class="chips-empty">type something first</div>';
  ws.forEach((w,n)=>{
    if(w==='\n')return;
    const c=document.createElement('button');
    c.className='chip'+(s.accents.has(n)?' on':''); c.textContent=w;
    c.onclick=()=>{ s.accents.has(n)?s.accents.delete(n):s.accents.add(n); sync(); };
    chips.appendChild(c);
  });
  const seg=$('arrowseg'); seg.innerHTML='';
  [['up','\u2191 up'],['down','\u2193 down'],['none','none']].forEach(([k,label])=>{
    const b=document.createElement('button');
    b.className = state.arrowDir===k ? 'on' : '';
    b.textContent = label;
    b.onclick=()=>{ state.arrowDir=k; sync(); };
    seg.appendChild(b);
  });
  ['swipe','cta'].forEach(k=>$('l_'+k).classList.toggle('on',$(k).checked));
}
function sync(){ paintRail(); render(); }

/* ============================================================
   EVENTS
   ============================================================ */
function wire(){
  $('ta').addEventListener('input',e=>{
    const s=current(); if(!s)return;
    s.accents=remap(s.text,s.accents,e.target.value); s.text=e.target.value; sync();
  });
  ['ctaWhere','handle','name'].forEach(k=>
    $(k).addEventListener('input',e=>{ state[k]=e.target.value; render(); }));
  $('swipe').onchange =e=>{state.showSwipe=e.target.checked;sync();};
  $('cta').onchange   =e=>{state.showCta=e.target.checked;state.idx=Math.min(state.idx,totalSlides()-1);sync();};
  $('prev').onclick=()=>{state.idx=(state.idx-1+totalSlides())%totalSlides();sync();};
  $('next').onclick=()=>{state.idx=(state.idx+1)%totalSlides();sync();};
  document.addEventListener('keydown',e=>{
    if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;
    if(e.key==='ArrowRight') $('next').click();
    if(e.key==='ArrowLeft')  $('prev').click();
  });
  $('dl1').onclick=()=>save(state.idx);
  $('dlall').onclick=async()=>{
    const keep=state.idx;
    for(let n=0;n<totalSlides();n++){ await save(n); await new Promise(r=>setTimeout(r,300)); }
    state.idx=keep; sync();
  };
}

/* the canvas you see is the file you get */
function save(n){
  return new Promise(res=>{
    const keepIdx=state.idx;
    state.idx=n; paint();
    canvas.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=`slide-${String(n+1).padStart(2,'0')}.png`;
      a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      state.idx=keepIdx; paint(); res();
    },'image/png');
  });
}

/* ============================================================
